name: OpenjdkToolkit

on:
  workflow_dispatch:

permissions:
  packages: write

env:
  IMAGE_NAME: openjdk

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - openjdk_version: 8u362
            gradle_version: 7.4.2
            maven_version: 3.8.8
            tag: 8-gradle-7.4.2-maven-3.8.8
          - openjdk_version: 11.0.18
            gradle_version: 7.4.2
            maven_version: 3.8.8
            tag: 11-gradle-7.4.2-maven-3.8.8
          - openjdk_version: 14.0.2-oraclelinux7
            gradle_version: 7.4.2
            maven_version: 3.8.8
            tag: 14-gradle-7.4.2-maven-3.8.8-v3
          - openjdk_version: 15.0.2
            gradle_version: 7.4.2
            maven_version: 3.8.8
            tag: 15-gradle-7.4.2-maven-3.8.8
          - openjdk_version: 17.0.6
            gradle_version: 7.4.2
            maven_version: 3.8.8
            tag: 17-gradle-7.4.2-maven-3.8.8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
            verystar/${{ env.IMAGE_NAME }}
            registry.verystar.net/library/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.verystar.net
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:openjdk/toolkit"
          push: true
          platforms: linux/amd64
          build-args: |
            openjdk_version=${{ matrix.openjdk_version }}
            gradle_version=${{ matrix.gradle_version }}
            maven_version=${{ matrix.maven_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
