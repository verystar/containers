name: OpenJDK Toolkit

on:
  workflow_dispatch:
    inputs:
      target:
        description: "选择要构建的目标"
        type: choice
        default: all
        options:
          - all
          - 8
          - 11
          - 15
          - 17
          - 21
          - 25

permissions:
  packages: write

env:
  IMAGE_NAME: openjdk

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        shell: bash
        run: |
          target="${{ github.event.inputs.target }}"
          full='[
            {"jdk":"8","openjdk_version":"8u502","gradle_version":"7.4.2","maven_version":"3.8.8"},
            {"jdk":"11","openjdk_version":"11.0.32","gradle_version":"7.4.2","maven_version":"3.8.8"},
            {"jdk":"15","openjdk_version":"15.0.2","gradle_version":"7.4.2","maven_version":"3.8.8"},
            {"jdk":"17","openjdk_version":"17.0.20","gradle_version":"8.14.5","maven_version":"3.9.16"},
            {"jdk":"21","openjdk_version":"21.0.12","gradle_version":"8.14.5","maven_version":"3.9.16"},
            {"jdk":"25","openjdk_version":"25.0.4","gradle_version":"9.6.1","maven_version":"3.9.16"}
          ]'
          if [ "$target" = "all" ]; then
            matrix=$(printf '%s' "$full" | jq -c '.')
          else
            matrix=$(printf '%s' "$full" | jq -c --arg t "$target" 'map(select(.jdk == $t))')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare versions
        id: prep
        env:
          GRADLE_VERSION: ${{ matrix.gradle_version }}
          MAVEN_VERSION: ${{ matrix.maven_version }}
        run: |
          echo "gradle=${GRADLE_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "maven=${MAVEN_VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "ts=$(TZ=Asia/Shanghai date '+%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
            verystar/${{ env.IMAGE_NAME }}
            registry.verystar.net/library/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.jdk }}-gradle-${{ steps.prep.outputs.gradle }}-maven-${{ steps.prep.outputs.maven }}
            type=raw,value=${{ matrix.jdk }}-gradle-${{ matrix.gradle_version }}-maven-${{ matrix.maven_version }}
            type=raw,value=${{ matrix.jdk }}-gradle-${{ matrix.gradle_version }}-maven-${{ matrix.maven_version }}-${{ steps.prep.outputs.ts }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.verystar.net
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:openjdk/toolkit"
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            openjdk_version=${{ matrix.openjdk_version }}
            gradle_version=${{ matrix.gradle_version }}
            maven_version=${{ matrix.maven_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
