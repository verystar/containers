name: PHP Composer

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "php/**"
  #     - ".github/workflows/php-composer.yaml"
  workflow_dispatch:
    inputs:
      target:
        description: "选择要构建的目标"
        type: choice
        default: all
        options:
          - all
          - php71-composer1
          - php71-composer2
          - php73-composer1
          - php73-composer2
          - php82-composer2

permissions:
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.verystar.net
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve targets
        id: resolve
        run: |
          sel="${{ github.event.inputs.target }}"
          if [ "$sel" = "all" ]; then
            {
              echo "list<<EOF"
              echo "php71-composer1"
              echo "php71-composer2"
              echo "php73-composer1"
              echo "php73-composer2"
              echo "php82-composer2"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "list=$sel" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          context: php
          files: build/php-composer.hcl
          push: true
          targets: ${{ steps.resolve.outputs.list }}
